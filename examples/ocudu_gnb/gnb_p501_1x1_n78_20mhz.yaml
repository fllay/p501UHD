# OCUDU gNB on the PZSDR P501 through the uhd_p501 UHD module: band n78, 20 MHz, 30 kHz SCS, 1T1R.
# Tested with OCUDU commit bd0d2cd27c + ocudu/ocudu_p501.patch, board bitstream p501/base_ts_txbuf, PLMN 00101.
# Lines marked [p501] are specific to this radio; see examples/ocudu_gnb/README.md.
cu_cp:
  amf:
    addr: 10.53.1.2
    port: 38412
    bind_addr: 192.168.68.30
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
          - plmn: "00102"
            tai_slice_support_list:
              - sst: 1
ru_sdr:
  device_driver: uhd                                            # The RF driver name.
  device_args:  type=p501,tx_advance_samples=92160   # [p501] TX timestamps are shifted this many samples (3 ms); the driver removes the shift
  clock: internal                                                       # Specify the clock source used by the RF.
  sync: internal                                                        # Specify the sync source used by the RF.
  srate: 30.72                                                  # RF sample rate might need to be adjusted according to selected bandwidth.
  otw_format: sc12   # [p501] the AD9361 port is 12 bit
  time_alignment_calibration: -92160   # [p501] must be minus tx_advance_samples; gives the gNB 3 ms of RX->TX processing time
  tx_gain: 69   # [p501] 89.75 minus TX attenuation in dB (0.25 dB steps): 69 = 20.75 dB attenuation, RSRP about -87 dBm with the phone close to the antenna
  rx_gain: 45   # [p501] AD9361 gain index 0-76. Swept with a phone at normal range: 30 -> 5 Mbit/s UL, 45 -> 14, 48 -> 15, 54+ overloads (ovl). Lower it if the phone is very close

cell_cfg:
  dl_arfcn: 632628                                                # ARFCN of the downlink carrier (center frequency).
  band: 78                                                        # The NR band.
  channel_bandwidth_MHz: 20                                       # Bandwith in MHz. Number of PRBs will be automatically derived.
  common_scs: 30                                                  # Subcarrier spacing in kHz used for data.
  plmn: "00101"                                                   # PLMN broadcasted by the gNB.
  additional_plmns:
    - "00102"
  tac: 7                                                          # Tracking area code (needs to match the core configuration).
  pci: 3                                                          # Physical cell ID.
  nof_antennas_dl: 1
  nof_antennas_ul: 1
  ssb:
    ssb_period: 10
  prach:
    ra_resp_window: 20
  pdsch:
    mcs_table: qam256
    # Phones report CQI 5 regardless of signal level (see README), so link adaptation must be allowed to move far from it
    olla_cqi_inc_step: 0.05
    olla_target_bler: 0.1
    olla_max_cqi_offset: 12
  pusch:
    # default OLLA (1% target, 0.001 dB step, +-5 dB) left the uplink at MCS 0-2 and ~30-45% CRC failures
    olla_target_bler: 0.1
    olla_snr_inc_step: 0.01
    olla_max_snr_offset: 15
log:
  filename: /tmp/gnb.log                                          # Path of the log file.
  all_level:  warning                                               # Logging level applied to all layers.
  #phy_rx_symbols_filename: /tmp/iq.log

pcap:
  mac_type: dlt
  mac_enable: true                                               # Set to true to enable MAC-layer PCAPs.
  mac_filename: /tmp/gnb_mac.pcap  #/home/pi/src/fifo/gnb_mac.pcap         #/tmp/gnb_mac.pcap                                 # Path where the MAC PCAP is stored.
  ngap_enable: true                                              # Set to true to enable NGAP PCAPs.
  ngap_filename: /tmp/gnb_ngap.pcap #/home/pi/src/fifo/gnb_ngap.pcap                               # Path where the NGAP PCAP is stored.



#metrics:
#  autostart_stdout_metrics: true
#  enable_json: true
#remote_control:
#  bind_addr: 0.0.0.0
#  enabled: true

expert_phy:
  max_proc_delay: 5
